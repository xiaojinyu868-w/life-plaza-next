name: Deploy classroom to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - 'assets/models/**'
      - 'build.js'
      - 'scripts/build-pages.cjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Build self-contained classroom
        run: node scripts/build-pages.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish classroom
        id: deployment
        uses: actions/deploy-pages@v4
